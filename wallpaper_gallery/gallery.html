<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wallpaper Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      font-family: "JetBrainsMono Nerd Font", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f0edfc;
    }

    .top-badge {
      position: absolute;
      top: 36px;
      padding: 8px 20px;
      background: rgba(19, 22, 48, 0.90);
      border: 1px solid rgba(200, 180, 250, 0.35);
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #c8b4fa;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .close-btn {
      position: absolute;
      top: 36px;
      right: 48px;
      width: 36px;
      height: 36px;
      background: rgba(19, 22, 48, 0.90);
      border: 1px solid rgba(200, 180, 250, 0.35);
      border-radius: 50%;
      color: #c8b4fa;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .close-btn:hover {
      background: #c8b4fa;
      color: #14172f;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(200, 180, 250, 0.6);
    }

    .toast {
      position: absolute;
      top: 90px;
      background: rgba(20, 23, 47, 0.94);
      border: 1px solid #a6e3a1;
      color: #a6e3a1;
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(166, 227, 161, 0.3);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .stage {
      width: 100vw;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .carousel {
      width: 0;
      height: 0;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      position: absolute;
      width: 175px;
      height: 380px;
      left: -87.5px;
      top: -190px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(200, 180, 250, 0.25);
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
                  opacity 0.35s ease,
                  filter 0.35s ease,
                  box-shadow 0.35s ease,
                  border-color 0.35s ease;
      background: #14172f;
      will-change: transform, opacity;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card.active {
      border: 2.5px solid #c8b4fa;
      box-shadow: 0 0 35px rgba(200, 180, 250, 0.55), 0 22px 55px rgba(0, 0, 0, 0.85);
      cursor: pointer;
      z-index: 100;
    }

    .card.active::after {
      content: "⏎ APPLY";
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(19, 22, 48, 0.92);
      border: 1px solid #c8b4fa;
      color: #c8b4fa;
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.92;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .card.active:hover::after {
      background: #c8b4fa;
      color: #14172f;
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 0 20px rgba(200, 180, 250, 0.6);
    }

    .bottom-bar {
      position: absolute;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      background: rgba(19, 22, 48, 0.92);
      border: 1px solid rgba(200, 180, 250, 0.35);
      border-radius: 18px;
      padding: 12px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .wallpaper-title {
      font-size: 16px;
      font-weight: 700;
      color: #c8b4fa;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(200, 180, 250, 0.3);
      max-width: 600px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wallpaper-meta {
      font-size: 12px;
      color: #8a8eb5;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag {
      background: rgba(200, 180, 250, 0.15);
      color: #c8b4fa;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .apply-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(200, 180, 250, 0.18);
      border: 1px solid #c8b4fa;
      color: #f0edfc;
      padding: 6px 22px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 4px 15px rgba(200, 180, 250, 0.2);
    }

    .apply-btn:hover {
      background: #c8b4fa;
      color: #14172f;
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(200, 180, 250, 0.5);
    }

    .apply-btn.applied {
      background: #a6e3a1;
      border-color: #a6e3a1;
      color: #14172f;
      box-shadow: 0 0 25px rgba(166, 227, 161, 0.6);
      transform: scale(1.03);
    }

    .shortcuts-hint {
      margin-top: 2px;
      font-size: 11px;
      color: rgba(240, 237, 252, 0.55);
      display: flex;
      gap: 16px;
    }

    .shortcuts-hint kbd {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      color: #f0edfc;
    }
  </style>
</head>
<body id="bg">
  <div class="top-badge">
    <span>󰸉</span> Wallpaper Gallery (<span id="count">0</span>)
  </div>

  <div class="toast" id="toast">✓ Applied in Real Time</div>

  <div class="close-btn" id="closeBtn" title="Close (Esc)">✕</div>

  <div class="stage" id="stage">
    <div class="carousel" id="carousel"></div>
  </div>

  <div class="bottom-bar">
    <div class="wallpaper-title" id="title">Loading...</div>
    <div class="wallpaper-meta">
      <span class="tag" id="folderTag">folder</span>
      <span id="indexTag">0 / 0</span>
    </div>
    <button class="apply-btn" id="applyBtn" onclick="selectCurrent()">
      <span>󰸉</span> APPLY IN REAL TIME <kbd>⏎</kbd>
    </button>
    <div class="shortcuts-hint">
      <span><kbd>←</kbd> <kbd>→</kbd> Navigate</span>
      <span><kbd>⏎</kbd> Apply</span>
      <span><kbd>⎋ Esc</kbd> Close</span>
    </div>
  </div>

  <script>
    let wallpapers = [];
    let currentIndex = 0;
    let isWheeling = false;

    const carousel = document.getElementById("carousel");
    const titleEl = document.getElementById("title");
    const folderTagEl = document.getElementById("folderTag");
    const indexTagEl = document.getElementById("indexTag");
    const countEl = document.getElementById("count");

    function renderCards() {
      carousel.innerHTML = "";
      wallpapers.forEach((wp, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = "card-" + idx;
        
        const img = document.createElement("img");
        img.src = "file://" + encodeURI(wp.path);
        img.loading = "lazy";
        card.appendChild(img);

        card.addEventListener("click", (e) => {
          e.stopPropagation();
          if (idx === currentIndex) {
            selectCurrent();
          } else {
            setIndex(idx);
          }
        });

        carousel.appendChild(card);
      });

      updateLayout();
    }

    function updateLayout() {
      if (wallpapers.length === 0) return;

      const total = wallpapers.length;
      countEl.innerText = total;

      const maxVisible = 7; // items visible on each side

      wallpapers.forEach((_, idx) => {
        const card = document.getElementById("card-" + idx);
        if (!card) return;

        const d = idx - currentIndex;
        const absD = Math.abs(d);

        if (absD > maxVisible) {
          card.style.display = "none";
          return;
        }

        card.style.display = "block";

        if (d === 0) {
          card.className = "card active";
          card.style.transform = "translateX(0) scale(1.05)";
          card.style.opacity = "1";
          card.style.filter = "brightness(1.05)";
          card.style.zIndex = "100";
        } else if (d > 0) {
          card.className = "card";
          const x = 115 + (d - 1) * 88;
          const scale = Math.max(0.62, 1.0 - d * 0.055);
          const opacity = Math.max(0.25, 1.0 - d * 0.10);
          card.style.transform = `translateX(${x}px) scale(${scale})`;
          card.style.opacity = opacity.toString();
          card.style.filter = `brightness(${Math.max(0.55, 0.92 - d * 0.06)})`;
          card.style.zIndex = (100 - d).toString();
        } else {
          card.className = "card";
          const x = -115 - (absD - 1) * 88;
          const scale = Math.max(0.62, 1.0 - absD * 0.055);
          const opacity = Math.max(0.25, 1.0 - absD * 0.10);
          card.style.transform = `translateX(${x}px) scale(${scale})`;
          card.style.opacity = opacity.toString();
          card.style.filter = `brightness(${Math.max(0.55, 0.92 - absD * 0.06)})`;
          card.style.zIndex = (100 - absD).toString();
        }
      });

      const current = wallpapers[currentIndex];
      if (current) {
        titleEl.innerText = current.name;
        folderTagEl.innerText = current.category || "wallpapers";
        indexTagEl.innerText = `${currentIndex + 1} / ${total}`;
      }
    }

    function setIndex(index) {
      if (wallpapers.length === 0) return;
      if (index < 0) index = wallpapers.length - 1;
      if (index >= wallpapers.length) index = 0;
      currentIndex = index;
      updateLayout();
    }

    function prev() {
      setIndex(currentIndex - 1);
    }

    function next() {
      setIndex(currentIndex + 1);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.innerText = text;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function selectCurrent() {
      if (wallpapers.length === 0) return;
      const current = wallpapers[currentIndex];
      
      const btn = document.getElementById("applyBtn");
      if (btn) {
        btn.classList.add("applied");
        btn.innerHTML = `<span>✓</span> APPLIED IN REAL TIME!`;
        setTimeout(() => {
          btn.classList.remove("applied");
          btn.innerHTML = `<span>󰸉</span> APPLY IN REAL TIME <kbd>⏎</kbd>`;
        }, 1500);
      }

      showToast(`✓ Applied: ${current.name}`);

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage({
          action: "apply",
          path: current.path,
          name: current.name
        });
      }
    }

    function closeGallery(reason) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage({
          action: "close",
          reason: reason || "unknown"
        });
      }
    }

    // Expose functions globally for Swift WebKit evaluateJavaScript
    window.prev = prev;
    window.next = next;
    window.selectCurrent = selectCurrent;
    window.closeGallery = closeGallery;

    // Keyboard navigation inside WebKit
    window.addEventListener("keydown", (e) => {
      const isLeft = e.key === "ArrowLeft" || e.code === "ArrowLeft" || e.keyCode === 37 || e.code === "KeyH";
      const isRight = e.key === "ArrowRight" || e.code === "ArrowRight" || e.keyCode === 39 || e.code === "KeyL";
      const isUp = e.key === "ArrowUp" || e.code === "ArrowUp" || e.keyCode === 38 || e.code === "KeyK";
      const isDown = e.key === "ArrowDown" || e.code === "ArrowDown" || e.keyCode === 40 || e.code === "KeyJ";
      const isEnter = e.key === "Enter" || e.code === "Enter" || e.keyCode === 13 || e.key === " " || e.code === "Space" || e.keyCode === 32;
      const isEscape = e.key === "Escape" || e.code === "Escape" || e.keyCode === 27;

      if (isLeft || isUp) {
        e.preventDefault();
        e.stopPropagation();
        prev();
      } else if (isRight || isDown) {
        e.preventDefault();
        e.stopPropagation();
        next();
      } else if (isEnter) {
        e.preventDefault();
        e.stopPropagation();
        selectCurrent();
      } else if (isEscape) {
        e.preventDefault();
        e.stopPropagation();
        closeGallery("escape_key");
      }
    });

    // Mouse wheel / trackpad horizontal scrolling with debouncing
    window.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 12) return;

      if (!isWheeling) {
        isWheeling = true;
        if (delta > 0) next();
        else prev();

        setTimeout(() => {
          isWheeling = false;
        }, 140);
      }
    }, { passive: false });

    // Focus on click background
    document.getElementById("bg").addEventListener("click", () => {
      window.focus();
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      closeGallery("close_button");
    });

    // Bridge function called from Swift
    window.loadWallpapers = function(items, activePath) {
      wallpapers = items || [];
      currentIndex = 0;
      if (activePath) {
        const found = wallpapers.findIndex(w => w.path === activePath || activePath.endsWith(w.name));
        if (found !== -1) currentIndex = found;
      }
      renderCards();
      window.focus();
    };

    // Tell Swift that WebKit is ready
    document.addEventListener("DOMContentLoaded", () => {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage({ action: "ready" });
      }
    });
  </script>
</body>
</html>
